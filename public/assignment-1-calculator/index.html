<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A beginner-friendly JavaScript calculator lab." />
    <title>JavaScript Calculator | Web Development Lab</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="calculator-page">
      <a class="back-link" href="../">← Back to all assignments</a>

      <section class="calculator-card" aria-labelledby="page-title">
        <p class="eyebrow">ASSIGNMENT 01</p>
        <h1 id="page-title">JavaScript Calculator</h1>
        <p class="intro">Choose an operation, enter two numbers, and calculate the result.</p>

        <form id="calculator-form" novalidate>
          <div class="field-group">
            <label for="first-number">First number</label>
            <input id="first-number" name="firstNumber" type="number" step="any" inputmode="decimal" required />
          </div>

          <div class="field-group">
            <label for="operation">Operation</label>
            <select id="operation" name="operation" required>
              <option value="add">Addition (+)</option>
              <option value="subtract">Subtraction (−)</option>
              <option value="multiply">Multiplication (×)</option>
              <option value="divide">Division (÷)</option>
            </select>
          </div>

          <div class="field-group">
            <label for="second-number">Second number</label>
            <input id="second-number" name="secondNumber" type="number" step="any" inputmode="decimal" required />
          </div>

          <button class="calculate-button" type="submit">Calculate</button>
        </form>

        <p id="result" class="result" role="status" aria-live="polite" aria-atomic="true">
          Enter two numbers to get started.
        </p>
      </section>
    </main>
  </body>
</html>
